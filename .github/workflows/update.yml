name: تحديث ونشر فرص عمادة شؤون الطلاب

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تجهيز Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: تثبيت أداة قراءة HTML
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: جلب المنشورات وتصنيفها
        run: python scripts/fetch_posts.py

      - name: حفظ البيانات الجديدة
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "لا توجد منشورات جديدة أو تغييرات في البيانات."
          else
            git commit -m "chore: تحديث موجز فرص عمادة شؤون الطلاب"
            git push
          fi
